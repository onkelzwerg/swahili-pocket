<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline — Swahili Spark</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #faf5ed; color: #2a1a10; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; color: #c2522a; }
      p { margin: 0; max-width: 28ch; line-height: 1.5; opacity: 0.8; }
      button { margin-top: 24px; background: #c2522a; color: #faf5ed; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Hujambo!</h1>
      <p>Hakuna mtandao kwa sasa. Sobald du wieder online bist, geht's weiter.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </div>
  </body>
</html>
